name: Build standalone tool for Windows

on: push

jobs:

  Compile-on-Windows:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v7
      
      - name: Download geodiff.exe from latest geodiff release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download `
            --repo MerginMaps/geodiff `
            --pattern "geodiff.exe" `
            --dir scripts/windows_binaries

      - uses: actions/setup-python@v7
        with:
            python-version: '3.12' 

      - name: Install dependencies
        run: |
            python -m pip install -r requirements.txt
            python -m pip install pyinstaller

      - name: Build Binary
        run: |
            cd scripts
            cmd.exe /C build_exe.bat
      
      - name: Copy config file
        run: copy config.yaml.default scripts/dist/config.yaml
 
      - name: Upload Zip file as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dbsync_standalone_win
          path: scripts/dist 